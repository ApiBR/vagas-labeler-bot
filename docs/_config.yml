title: Vagas Labeler Bot
description: >-
  Automatic label classification for developer job postings on GitHub Issues —
  built with ASP.NET Core 10, LavinMQ, and MariaDB.

theme: just-the-docs

url: https://apibr.github.io
baseurl: /vagas-labeler-bot

# Pretty (extensionless, trailing-slash) permalinks — required for the site's own
# {{ site.baseurl }}/section/page/ cross-links to actually resolve instead of 404ing
# on the default Jekyll .html-suffixed URLs.
permalink: pretty

# ── Navigation ──────────────────────────────────────────────────────────────
nav_sort: order
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

# ── Search ───────────────────────────────────────────────────────────────────
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# ── Appearance ───────────────────────────────────────────────────────────────
color_scheme: dark

# ── GitHub integration ───────────────────────────────────────────────────────
gh_edit_link: true
gh_edit_link_text: "✏️ Edit this page on GitHub"
gh_edit_repository: "https://github.com/ApiBR/vagas-labeler-bot"
gh_edit_branch: "main"
gh_edit_source: docs
gh_edit_view_mode: "edit"

# ── Footer ───────────────────────────────────────────────────────────────────
footer_content: >-
  Copyright &copy; 2026
  <a href="https://github.com/ApiBR">API BR</a>.
  Distributed under an
  <a href="https://github.com/ApiBR/vagas-labeler-bot/blob/main/LICENSE">MIT license.</a>

# ── Callouts ─────────────────────────────────────────────────────────────────
callouts_level: quiet
callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red

# ── Jekyll ───────────────────────────────────────────────────────────────────
plugins:
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - agents

markdown: kramdown
highlighter: rouge
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: true

# ── SEO ───────────────────────────────────────────────────────────────────────
author: ApiBR
lang: en
